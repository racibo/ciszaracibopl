name: Build static noise cache

on:
  schedule:
    # Raz w miesiącu (1. dzień, 03:17 UTC) – darmowy cron GitHub Actions.
    - cron: '17 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyosmium
        run: python -m pip install --quiet osmium

      - name: Download Geofabrik voivodeship extracts (BEZ Overpassa)
        run: |
          BASE=https://download.geofabrik.de/europe/poland
          curl -sSL -o "$RUNNER_TEMP/pomorskie.osm.pbf"        "$BASE/pomorskie-latest.osm.pbf"
          curl -sSL -o "$RUNNER_TEMP/warminsko-mazurskie.osm.pbf" "$BASE/warminsko-mazurskie-latest.osm.pbf"
          curl -sSL -o "$RUNNER_TEMP/kujawsko-pomorskie.osm.pbf" "$BASE/kujawsko-pomorskie-latest.osm.pbf"
          echo "GEOFABRIK_PBFS=$RUNNER_TEMP/pomorskie.osm.pbf:$RUNNER_TEMP/warminsko-mazurskie.osm.pbf:$RUNNER_TEMP/kujawsko-pomorskie.osm.pbf" >> "$GITHUB_ENV"

      - name: Generate static tiles
        run: python scripts/build-cache-geofabrik.py

      - name: Commit tiles
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'cache: odśwież statyczne kafelki hałasu (Geofabrik)'
          file_pattern: 'tiles/*'
          commit_user_name: 'cache-bot'
          commit_user_email: 'cache-bot@users.noreply.github.com'
